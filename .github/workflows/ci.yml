name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # peachycheck checks itself with the action and the code under test.
  peachycheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./
  # The types and the tests; every linter runs on a fixture and its finding
  # parses and links its rule.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run --no-sync peachycheck install
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -q
        env:
          REQUIRE_CHECKERS: "1"
