name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # plumbcheck checks itself with the commit under test.
  plumbcheck:
    uses: ./.github/workflows/check.yml
    with:
      version: ${{ github.event.pull_request.head.sha || github.sha }}
  # Every linter runs on a fixture and its finding parses.
  linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run --no-sync plumbcheck install
      - run: uv run --no-sync plumbcheck --root tests/fixtures/org check
      - run: uv run --no-sync pytest -q tests/test_linting.py -k each_linter_flags
        env:
          REQUIRE_CHECKERS: "1"
      - name: The packages hold no guides or organization content
        run: uv run --no-sync pytest -q tests/test_release.py
