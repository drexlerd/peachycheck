# The organization's one check. A repository calls it with three lines:
#
#   jobs:
#     standards:
#       uses: verdog-ai/standards/.github/workflows/check.yml@main
#
# A repository with private submodules or private sibling repositories adds
# `secrets: inherit` and needs a SUBMODULES_TOKEN secret that can read them.
#
# It recognises the repository's types, requires the shared tool
# configurations, runs the types' commands and the linters of standards.yml:
# on a pull request every finding in a changed file fails, on a push to the
# default branch every finding in the repository.
name: Standards

on:
  workflow_call:
    inputs:
      ref:
        description: The ref of verdog-ai/standards to check against.
        type: string
        default: main
    secrets:
      SUBMODULES_TOKEN:
        description: "Reads private submodules; pass it with `secrets: inherit`."
        required: false

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    env:
      STANDARDS_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The repository's own token reads only the repository itself; private
      # submodules are read with SUBMODULES_TOKEN.
      - name: Check out submodules
        if: hashFiles('.gitmodules') != ''
        env:
          TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
        run: >-
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
          submodule update --init --recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # CMake reads the launcher from the environment, for its own builds and
      # those of Python build backends.
      - if: hashFiles('CMakeLists.txt') != ''
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ hashFiles('uv.lock', '**/CMakeLists.txt') }}
      - if: hashFiles('CMakeLists.txt') != ''
        run: |
          echo CMAKE_C_COMPILER_LAUNCHER=ccache >> "$GITHUB_ENV"
          echo CMAKE_CXX_COMPILER_LAUNCHER=ccache >> "$GITHUB_ENV"
      - if: hashFiles('package.json') != '' && hashFiles('.nvmrc') == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: hashFiles('.nvmrc') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install verdog-standards and its linters
        run: |
          uv tool install "verdog-standards @ git+https://github.com/verdog-ai/standards@${STANDARDS_REF}"
          verdog-standards install
      # Each uv path source `../<name>` with a repository verdog-ai/<name>,
      # on the same-named branch if it has one, so cross-repository changes
      # test together.
      - name: Check out sibling repositories
        env:
          TOKEN: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          auth="url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
          for name in $(verdog-standards siblings); do
            url="https://github.com/verdog-ai/${name}.git"
            git -c "$auth" ls-remote --exit-code "$url" HEAD > /dev/null 2>&1 || continue
            branch=()
            if git -c "$auth" ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null 2>&1; then
              branch=(--branch "$BRANCH")
            fi
            git -c "$auth" clone --depth 1 "${branch[@]}" "$url" "../$name"
          done
      - run: verdog-standards types
      - name: Tool configurations match the standards
        run: verdog-standards sync --check
      - name: The types' commands
        run: verdog-standards run
      # Runs even when a command failed, so a reported build failure does not
      # hide the findings; clang-tidy reads the compile commands `run` wrote.
      - name: No findings
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT" = true ]; then exec verdog-standards lint --all; fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=HEAD~1; fi
          verdog-standards lint --base "$BASE"
