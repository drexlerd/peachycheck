# peachycheck's check as a reusable workflow, for a repository that prefers
# three lines to a job:
#
#   jobs:
#     peachycheck:
#       uses: drexlerd/peachycheck/.github/workflows/check.yml@v0.1.0
#       secrets: inherit   # SUBMODULES_TOKEN for private submodules
#       # with:
#       #   prepare: npm ci  # what the linters need first
#
# It runs the action of this repository (action.yml) at the same release;
# see there. To keep a required status check's name, or to pin a commit,
# use the action in a job of your own instead.
name: peachycheck

on:
  workflow_call:
    inputs:
      version:
        description: The peachycheck to install; see action.yml.
        type: string
        default: ""
      prepare:
        description: A command the linters need first; see action.yml.
        type: string
        default: ""
    secrets:
      SUBMODULES_TOKEN:
        description: "Reads private submodules; pass it with `secrets: inherit`."
        required: false

permissions:
  contents: read

jobs:
  peachycheck:
    runs-on: ubuntu-latest
    steps:
      # The release this file belongs to; release.yml checks it.
      - uses: drexlerd/peachycheck@v0.1.0
        with:
          version: ${{ inputs.version }}
          prepare: ${{ inputs.prepare }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
