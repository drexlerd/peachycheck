# The organization's one check. A repository calls it with three lines:
#
#   jobs:
#     standards:
#       uses: verdog-ai/standards/.github/workflows/check.yml@main
#
# It recognises the repository's types, runs their commands, requires the
# shared tool configurations and fails on new findings in changed files.
name: Standards

on:
  workflow_call:
    inputs:
      ref:
        description: The ref of verdog-ai/standards to check against.
        type: string
        default: main

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    env:
      STANDARDS_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verdog-standards and its checkers
        run: |
          uv tool install "verdog-standards @ git+https://github.com/verdog-ai/standards@${STANDARDS_REF}"
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: verdog-standards types
      - name: Tool configurations match the standards
        run: verdog-standards sync --check
      - name: The types' commands
        run: verdog-standards run
      - name: No new findings in changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=HEAD~1; fi
          verdog-standards check-branch --base "$BASE"
