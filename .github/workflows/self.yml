name: Self

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standards:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
  instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run --no-sync verdog-standards install
      - run: uv run --no-sync verdog-standards check
      - run: uv run --no-sync verdog-standards lint --all
      # Each linter flags an inline fixture; none may be missing.
      - run: uv run --no-sync pytest -q tests/test_linting.py -k each_linter_flags
        env:
          REQUIRE_CHECKERS: "1"
