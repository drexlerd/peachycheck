name: Self

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standards:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
  instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install the checkers
        run: |
          sudo apt-get install -y clang-tidy
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run --no-sync verdog-standards check
      - run: uv run --no-sync pytest -q tests/test_engine.py -k each_checker_flags
        env:
          REQUIRE_CHECKERS: "1"
