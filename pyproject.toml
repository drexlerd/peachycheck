[project]
name = "verdog-standards"
version = "0.2.0"
description = "The coding and documentation standards of verdog-ai, and their checks"
readme = "README.md"
license = "AGPL-3.0-only"
# The bundled guides and Vale styles keep their own licenses.
license-files = [
    "LICENSE",
    "standards/languages/*/references/*/LICENSE",
    "standards/languages/*/references/*/ATTRIBUTION.md",
    "rules/vale/styles/*/LICENSE",
]
authors = [{ name = "verdog-ai" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
# The linters of standards.yml that are Python packages, pinned; vale and
# gitleaks are downloaded by `verdog-standards install`.
dependencies = [
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "codespell==2.4.3",
    "doc8==2.0.0",
    "clang-tidy==22.1.8",
]

[project.urls]
Homepage = "https://github.com/verdog-ai/standards"
Source = "https://github.com/verdog-ai/standards"
Issues = "https://github.com/verdog-ai/standards/issues"

[project.scripts]
verdog-standards = "verdog_standards.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.400",
    "coverage>=7",
    "jinja2>=3.1.6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The C++ Core Guidelines are fetched into the cache at runtime, never packaged.
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "standards",
    "rules",
    "standards.yml",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verdog_standards"]

[tool.hatch.build.targets.wheel.force-include]
"standards" = "verdog_standards/standards"
"rules" = "verdog_standards/rules"
"standards.yml" = "verdog_standards/standards.yml"
