[project]
name = "peachycheck"
version = "0.1.1"
description = "Native linters and agent hooks from one peachycheck.yml per repository"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "drexlerd" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
# The default linters that are Python packages, pinned; vale and gitleaks
# are downloaded by `peachycheck install`.
dependencies = [
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "codespell==2.4.3",
    "doc8==2.0.0",
    "clang-tidy==22.1.8",
    "clang-format==22.1.8",
    "j2lint==1.3.0",
    "pyright==1.1.414",
]

[project.urls]
Homepage = "https://github.com/drexlerd/peachycheck"
Source = "https://github.com/drexlerd/peachycheck"
Issues = "https://github.com/drexlerd/peachycheck/issues"

[project.scripts]
peachycheck = "peachycheck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "coverage>=7",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/peachycheck"]
