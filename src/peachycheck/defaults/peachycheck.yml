# peachycheck's defaults: every configuration extends this file first.
#
# A repository's peachycheck.yml, and the files it EXTENDS (URLs or paths),
# override any key: later files win, mappings merge key by key, and the keys
# CONFIG_PROPERTIES_TO_APPEND names append their lists instead, as in
# MegaLinter (https://megalinter.io/latest/config-file/). Relative paths in
# FILES resolve against the file that names them.
#
# Overrides, as in MegaLinter: ENABLE_LINTERS (only these), DISABLE_LINTERS,
# FILTER_REGEX_EXCLUDE (a path regex for every linter) and, per linter,
# <LINTER>_FILTER_REGEX_INCLUDE, <LINTER>_FILTER_REGEX_EXCLUDE and
# <LINTER>_ARGUMENTS (appended to its command).

# FILES: the base configurations `sync` writes into the repository's
# .peachycheck/ folder, such as `ruff.toml: rules/ruff.toml`: those under
# `general` for every repository, those under a marker file (such as
# `pyproject.toml`) for each repository that has it; a later entry wins.
# None by default.
# GENERATED: the files lint never checks, listed in a JSON file of the
# repository: `file`, the `list` of entries in it, each entry's `path` key
# and the values `where` an entry must have; none by default. For example
#   GENERATED: {file: manifest.json, list: sources, path: path,
#               where: {ownership: generated}}
#
# peachycheck holds no opinions and runs no builds or tests: this file only
# says how to run and read each linter. Every linter runs with its own
# defaults unless a configuration says otherwise.

# One entry per linter. A linter checks the files with its `extensions`, or
# every file without any. `command` gets the files appended ({python} is
# peachycheck's interpreter); `fix`, if any, runs first with `lint --fix`.
# `config` passes the repository's own file of that name, else the base in
# .peachycheck/, else none; with `required`, the linter skips a repository
# without one (the tool cannot run without), and `merge: yaml` lays the
# repository's file over the base (clang-tidy cannot extend another file).
# `output` parses the findings: json-ruff, json-eslint, json-vale,
# json-gitleaks, json-j2lint, json-pyright or regex:<pattern> (groups path, line, rule,
# message; `rule` names the rule when the pattern has none), read from
# stdout, or from stderr with `stream: stderr`. `one_run` checks all files
# in one run (the linter parallelizes itself). `cache` keeps each file's
# findings in ~/.cache/peachycheck/results until an input changes: the file,
# with `includes: true` the repository files it includes, the `inputs`
# files from its folder up, its compile command, the linter's settings and
# its version. With `header_commands`, a file the compile database lacks,
# such as a header, borrows the command of a file that includes it.
# A finding of a `fatal` rule, wherever it lies, means the file did not
# compile: it is reported for the file instead of the other findings.
# `stage: stop` keeps a slow linter out of the hook after each
# edit; the stop hook, `lint` and CI still run it. `ok` lists the
# exit codes that mean "ran". `requires` is a file the linter needs, or a
# list of them of which the first that exists counts ({required} in
# `command` is that file, {requires} its folder), and `missing` says how to get it;
# <LINTER>_<requires_key> (default <LINTER>_REQUIRES) replaces `requires`.
# A finding links its rule's documentation: the URL the linter reports
# (ruff), else `rule_link`, a template or templates by rule prefix ({rule};
# {name}, the rule after the prefix or its group; {group}, the rule before
# its first / or -), else `link`.
LINTERS:
  PYTHON_RUFF:
    extensions: [.py]
    link: https://docs.astral.sh/ruff/rules/
    command: ruff check --no-cache --force-exclude --output-format json
    fix: ruff check --no-cache --force-exclude --fix --exit-zero --quiet
    config: {file: ruff.toml, flag: --config}
    output: json-ruff
  PYTHON_RUFF_FORMAT:
    extensions: [.py]
    link: https://docs.astral.sh/ruff/formatter/
    command: ruff format --no-cache --force-exclude --check --output-format json
    fix: ruff format --no-cache --force-exclude --quiet
    config: {file: ruff.toml, flag: --config}
    output: json-ruff
  PYTHON_PYRIGHT:
    extensions: [.py]
    link: https://microsoft.github.io/pyright/#/configuration
    rule_link: https://github.com/microsoft/pyright/blob/main/docs/configuration.md#{rule}
    # pyright reads the repository's pyrightconfig.json (or [tool.pyright])
    # itself, and resolves imports in its environment: the first of
    # `requires`, or the interpreter PYTHON_PYRIGHT_PYTHON names.
    command: pyright --outputjson --threads --pythonpath {required}
    output: json-pyright
    one_run: true
    requires: [.venv/bin/python]
    requires_key: PYTHON
    missing: create the repository's environment first (such as `uv sync`)
  J2LINT:
    extensions: [.j2, .jinja, .jinja2]
    link: https://github.com/aristanetworks/j2lint#rules
    command: j2lint --json
    output: json-j2lint
    ok: [0, 2]
  RST_DOC8:
    extensions: [.rst]
    link: https://github.com/PyCQA/doc8
    command: doc8
    output: 'regex:^(?P<path>[^:\n]+):(?P<line>\d+): (?P<rule>D\d+) (?P<message>.*)$'
  SPELL_VALE:
    extensions: [.rst]
    link: https://vale.sh/docs/
    command: vale --no-exit --output JSON
    config: {file: .vale.ini, flag: --config, required: true}
    output: json-vale
    ok: [0]
  SPELL_CODESPELL:
    extensions: [.rst]
    link: https://github.com/codespell-project/codespell
    command: codespell
    output: 'regex:^(?P<path>[^:\n]+):(?P<line>\d+): (?P<message>.*)$'
    rule: misspelling
    ok: [0, 65]
  TYPESCRIPT_ESLINT:
    extensions: [.ts, .tsx]
    link: https://eslint.org/docs/latest/rules/
    rule_link:
      "": https://eslint.org/docs/latest/rules/{rule}
      "@typescript-eslint/": https://typescript-eslint.io/rules/{name}
    # ESLint 9 has no `unix` formatter.
    command: node_modules/.bin/eslint --format json
    fix: node_modules/.bin/eslint --fix
    config: {file: eslint.config.mjs, flag: --config, required: true}
    output: json-eslint
    requires: node_modules/.bin/eslint
    missing: run `npm ci` first
  CPP_CLANG_TIDY:
    extensions: [.cpp, .cc, .cxx, .hpp, .hh, .h, .tpp, .ipp]
    link: https://clang.llvm.org/extra/clang-tidy/checks/list.html
    rule_link:
      "": https://clang.llvm.org/extra/clang-tidy/checks/{group}/{name}.html
      clang-analyzer-: https://clang.llvm.org/extra/clang-tidy/checks/clang-analyzer/{name}.html
    command: clang-tidy -p {requires} --quiet
    # A file with compile errors is left alone (no --fix-errors).
    fix: clang-tidy -p {requires} --quiet --fix
    cache: {includes: true, inputs: [.clang-tidy, .peachycheck/.clang-tidy]}
    header_commands: true
    fatal: [clang-diagnostic-error]
    stage: stop
    config: {file: .clang-tidy, flag: --config-file, merge: yaml}
    output: 'regex:^(?P<path>[^\s:][^:\n]*):(?P<line>\d+):\d+: (?:warning|error): (?P<message>.*) \[(?P<rule>[\w.,-]+)\]$'
    # CPP_CLANG_TIDY_COMPILE_COMMANDS: the path (or paths) of the
    # repository's compile_commands.json.
    requires: [build/peachycheck/compile_commands.json, build/compile_commands.json]
    requires_key: COMPILE_COMMANDS
    missing: configure CMake with CMAKE_EXPORT_COMPILE_COMMANDS=ON
  CPP_CLANG_FORMAT:
    extensions: [.cpp, .cc, .cxx, .hpp, .hh, .h, .tpp, .ipp]
    link: https://clang.llvm.org/docs/ClangFormatStyleOptions.html
    # Each file gets the nearest .clang-format above it, else LLVM's style.
    command: clang-format --dry-run
    fix: clang-format -i
    output: 'regex:^(?P<path>[^\s:][^:\n]*):(?P<line>\d+):\d+: warning: (?P<message>.*) \[-W(?P<rule>clang-format-violations)\]$'
    stream: stderr
    ok: [0]
  REPOSITORY_GITLEAKS:
    link: https://github.com/gitleaks/gitleaks
    # One path per run; peachycheck runs it per file.
    command: >-
      gitleaks dir --no-banner --log-level error --redact --exit-code 0
      --report-format json --report-path -
    per_file: true
    output: json-gitleaks
    ok: [0]

# The tools `peachycheck install` downloads into ~/.cache/peachycheck/bin,
# checked against their sha256 (linux x64). ruff, codespell, doc8,
# clang-tidy, clang-format, j2lint and pyright are pinned Python dependencies of peachycheck; eslint
# is the repository's own (node_modules).
VERSIONS:
  vale:
    version: 3.24.0
    url: https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
    sha256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
  gitleaks:
    version: 8.30.1
    url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
