# peachycheck's check of a repository, as one step of a job:
#
#   jobs:
#     peachycheck:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: drexlerd/peachycheck@v0.1.0
#           with:
#             token: ${{ secrets.SUBMODULES_TOKEN }}   # optional
#             prepare: npm ci                          # optional
#
# It checks the repository out, installs peachycheck (the `version` input,
# else PEACHYCHECK_VERSION of the repository's peachycheck.yml, else this
# action's own code), requires the shared tool configurations and runs the
# linters: on a pull request every finding in a changed file fails, on a
# push to the default branch every finding. It builds and tests nothing;
# `prepare` runs what a linter needs first, such as `npm ci` for ESLint or a
# CMake configure for clang-tidy's compile_commands.json.
name: peachycheck
description: Native linters and shared tool configurations from peachycheck.yml
branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: >-
      The peachycheck to install: a release such as 0.1.0 (from PyPI) or a git
      ref of drexlerd/peachycheck. Default: PEACHYCHECK_VERSION of
      peachycheck.yml, else this action's own code.
    default: ""
  token:
    description: >-
      Reads private submodules; default: the workflow's token.
    default: ""
  prepare:
    description: >-
      A shell command run in the repository before the linters, for what
      they need: `npm ci`, or a CMake configure that writes
      compile_commands.json. Default: none.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    # The repository's own token reads only the repository itself; private
    # submodules need the `token` input.
    - name: Check out submodules
      if: hashFiles('.gitmodules') != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.token || github.token }}
      run: >-
        git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
        submodule update --init --recursive
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
        enable-cache: true
    - if: hashFiles('package.json') != '' && hashFiles('.nvmrc') == ''
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - if: hashFiles('.nvmrc') != ''
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install peachycheck and its linters
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$VERSION" ] && [ -f peachycheck.yml ]; then
          VERSION=$(sed -nE 's/^PEACHYCHECK_VERSION:[[:space:]]*["'\'']?([^"'\''[:space:]]+).*/\1/p' peachycheck.yml | head -n 1)
        fi
        case "$VERSION" in
          "") spec="peachycheck @ file://$GITHUB_ACTION_PATH" ;;
          [0-9]*.[0-9]*) spec="peachycheck==$VERSION" ;;
          *) spec="peachycheck @ git+https://github.com/drexlerd/peachycheck@$VERSION" ;;
        esac
        echo "installing $spec"
        uv tool install "$spec"
        peachycheck --version
        peachycheck install
    - name: Tool configurations are in sync
      shell: bash
      run: peachycheck sync --check
    - name: Prepare
      if: inputs.prepare != ''
      shell: bash
      env:
        PREPARE: ${{ inputs.prepare }}
        TOKEN: ${{ inputs.token || github.token }}
      run: eval "$PREPARE"
    # Kept results of slow linters (clang-tidy): the latest of this branch or
    # of any other, so a run checks again only what changed.
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/peachycheck/results
        key: peachycheck-results-${{ github.run_id }}
        restore-keys: peachycheck-results-
    # Runs even when the configurations differ, so both are reported.
    - name: No findings
      if: ${{ !cancelled() }}
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        DEFAULT: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      run: |
        if [ "$DEFAULT" = true ]; then exec peachycheck lint --all; fi
        if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=HEAD~1; fi
        peachycheck lint --base "$BASE"
    # Saved even when the lint fails, so the next run starts from these;
    # a repository without a cached linter has none.
    - id: results
      if: ${{ !cancelled() }}
      shell: bash
      run: if [ -d ~/.cache/peachycheck/results ]; then echo kept=true >> "$GITHUB_OUTPUT"; fi
    - uses: actions/cache/save@v4
      if: ${{ !cancelled() && steps.results.outputs.kept == 'true' }}
      with:
        path: ~/.cache/peachycheck/results
        key: peachycheck-results-${{ github.run_id }}
