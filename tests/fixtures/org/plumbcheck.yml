# A sample organization: its guides and its base configurations, which
# `plumbcheck sync` writes into a repository's .plumbcheck/. Relative paths
# resolve against this file.
GUIDES: guides
RULES: rules
FILES:
  general:
    ruff.toml: rules/ruff.toml
    .clang-tidy: rules/.clang-tidy
    .vale.ini: rules/.vale.ini
  python-package:
    pyrightconfig.json: rules/pyrightconfig.json
