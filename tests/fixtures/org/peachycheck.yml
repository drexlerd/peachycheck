# A sample organization: its base configurations, which `peachycheck sync`
# writes into a repository's .peachycheck/. Relative paths resolve against
# this file.
FILES:
  general:
    ruff.toml: rules/ruff.toml
    .clang-tidy: rules/.clang-tidy
    .vale.ini: rules/.vale.ini
  pyproject.toml:
    pyrightconfig.json: rules/pyrightconfig.json
# The files a project manifest lists as generated; lint skips them.
GENERATED:
  file: manifest.json
  list: sources
  path: path
  where: {ownership: generated}
