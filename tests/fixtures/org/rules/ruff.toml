# The sample organization's ruff settings; in .peachycheck/, so paths start
# at its parent, the repository.
line-length = 80

[lint]
select = ["E", "F", "W", "I", "B", "D", "C90", "N"]

[lint.mccabe]
max-complexity = 15

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"../**/tests/**" = ["D", "C901"]
"../**/test_*.py" = ["D", "C901"]
